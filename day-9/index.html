<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    .btn-success{
    background-color: green;
    color: #ffffff;
    border-color: #16a34a;
}
.btn-success:hover{
    background-color: #158d;
    border-color: #158d;
    transform: translateY(-5px);
    box-shadow: 5px 4px 7px rgba(22, 163, 74, 0.4);

}

.btn-danger{
    background-color: red;
    color: aquamarine;
    border-color: #1da
    ;
}
.btn-danger:hover{
background-color: #158d;
    border-color: #158d;
    transform: translateY(-5px);
    /* box-shadow: 5px 4px 2px rgba(13, 26, 163, 0.4) */
    box-shadow: red;
}
.btn-warning{
    background-color: #d97706;
    color: yellow;
    border-color: palegoldenrod;

}

.btn-warning:hover{

    color: #d97706;
    background-color: white;
    transform: translateY(-5px);
    box-shadow: 100cap;

}

.btn-outline{

    color: paleturquoise;
    background-color: purple;
    border-color: #16a34a;

}

.btn-outline:hover{

    color: darkgray;
    background-color: black;
    transform: translateY(-5px);

}

.button-group{

    background-color: deepskyblue;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    box-sizing: content-box;
    padding: 5%;
    margin: 25%;
    
}

.Card-sheet{
    background-color: darkblue;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    max-width: 650px;
    width: 100%;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);

}


h1{
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    margin: 60px;
    color: white;
    margin-bottom: 15px;
    font-weight: 2000;
    white-space: nowrap;
    font-size: 15px;
    
    
}

p{
    color: #ffffff;
    font-size: larger;
    
}

body{

    padding: 300px;
    background-color: skyblue;
}

.Card-sheet:hover{
    padding: 25px;
    background-color: #0c1328;
    transform: rotate(5deg);
    border: 1px solid #04AA6D;
}

.code-note{
    color: white;
}
</style>
<body>
    <main class="Card-sheet">
    <h1>compnent library:Button variants </h1>

    <p>Demonstrating reusable button classes built with CSS grouping selectors, pseudo-classes (<code>:hover</code>, <code>:active</code>), and the DRY principle.</p>

    <div class="button-group">
    <button type="button" class="btn-success">save changes</button>
    <button type="button" class="btn-danger">delete account</button>
    <button type="button" class="btn-warning">Warning alert</button>
    <button type="button" class="btn-outline">view details</button>

    </div>

    

    <div class="code-note">
        <strong>DRY Architecture Note:</strong>
    </div>
    </main>
</body>
</html>
